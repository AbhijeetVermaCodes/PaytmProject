server:
  port: ${PORT:8080}
  shutdown: graceful

spring:
  application:
    name: ticket-booking-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:ticket_booking;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:50}
      minimum-idle: ${DB_POOL_MIN:10}
      idle-timeout: 30000
      connection-timeout: 10000
      max-lifetime: 1800000
      pool-name: TicketBookingHikariCP
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: false
        jdbc:
          batch_size: 50
  lifecycle:
    timeout-per-shutdown-phase: 15s

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
    prometheus:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name}

# Application domain settings
booking:
  default-per-user-limit: 4
  hold-duration-seconds: 120

logging:
  level:
    root: INFO
    com.ticketbooking: INFO
    org.hibernate.SQL: WARN
