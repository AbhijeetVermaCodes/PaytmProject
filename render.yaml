services:
  # ----------------------------------------------------------------------------
  # 1. Spring Boot Backend Web Service (Docker)
  # ----------------------------------------------------------------------------
  - type: web
    name: ticket-booking-backend
    runtime: docker
    dockerfilePath: Dockerfile
    plan: free
    healthCheckPath: /health/ready
    envVars:
      - key: PORT
        value: 8080
      - key: SPRING_DATASOURCE_URL
        value: jdbc:postgresql://aws-0-ap-northeast-2.pooler.supabase.com:5432/postgres?sslmode=require
      - key: SPRING_DATASOURCE_USERNAME
        value: postgres.yucvewmasaddstygsgea
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false  # Paste kVDrfbZpmwwxq8Jy in Render Dashboard
      - key: SPRING_DATASOURCE_DRIVER_CLASS_NAME
        value: org.postgresql.Driver
      - key: DB_POOL_MAX
        value: 10
      - key: DB_POOL_MIN
        value: 2

  # ----------------------------------------------------------------------------
  # 2. React + Tailwind Frontend (Static Site)
  # ----------------------------------------------------------------------------
  - type: web
    name: ticket-booking-frontend
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://ticket-booking-backend.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
